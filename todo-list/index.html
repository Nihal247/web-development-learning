<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
</head>
<body>
    <header>
    <h1>My To Do List</h1>
    <p>Stay organised and get things done</p>
    </header>
    <main>
        <section>
            <h2 id="task-section-title">My Tasks</h2>
        <form id="task-form">
            <label for="task">Enter a new task</label>
            <input  id="task" type="text" placeholder="What do you need to do?" required>
            <button type="submit">Add task</button>

        </form>
        <nav>
            <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
        </nav>
         <ul id="task-list"> </ul>
         <p id="task-summary">No tasks yet</p>

            <button type="button" id="clear-completed">
                Clear Completed
            </button>

        </section>
    </main>
    
</body>
</html>
